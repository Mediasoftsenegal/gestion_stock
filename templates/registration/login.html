{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Connexion · Ets J.C.Tavarès</title>
    <link rel="icon" href="{% static 'img/logo.jpg' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .bg-drink-right {
            position: fixed;
            top: 0;
            right: 0;
            width: 52%;
            height: 100%;
            background-image: url('https://images.pexels.com/photos/1283219/pexels-photo-1283219.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
            background-size: cover;
            background-position: 25% center;
            background-repeat: no-repeat;
            opacity: 0.65;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.4s ease;
            mask-image: linear-gradient(to left, rgba(0,0,0,1) 70%, rgba(0,0,0,0));
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 70%, rgba(0,0,0,0));
        }

        @media (max-width: 1000px) {
            .bg-drink-right {
                width: 55%;
                opacity: 0.55;
                mask-image: linear-gradient(to left, rgba(0,0,0,0.9) 60%, rgba(0,0,0,0));
            }
        }

        @media (max-width: 780px) {
            .bg-drink-right {
                width: 65%;
                opacity: 0.45;
                mask-image: linear-gradient(to left, rgba(0,0,0,0.8) 50%, rgba(0,0,0,0));
            }
        }

        @media (max-width: 650px) {
            .bg-drink-right { display: none; }
        }

        .glass-panel {
            position: relative;
            z-index: 10;
            background: linear-gradient(145deg, rgba(22, 28, 46, 0.92), rgba(18, 22, 40, 0.92));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            width: 100%;
            max-width: 470px;
            margin: 1.8rem;
            padding: 2.4rem 2.2rem 2.6rem;
            transition: transform 0.2s ease, box-shadow 0.3s;
        }

        .glass-panel:hover {
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.45);
            transform: translateY(-3px);
        }

        .app-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .app-brand img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            margin-bottom: 0.6rem;
        }

        .app-brand h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF, #E9D5FF, #D8B4FE);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            margin-bottom: 0.3rem;
        }

        .app-brand p {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 400;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .divider-light {
            height: 2px;
            width: 70px;
            background: rgba(255, 255, 255, 0.35);
            margin: 0.8rem auto 0;
            border-radius: 3px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: rgba(255, 255, 255, 0.9);
            margin-left: 0.3rem;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
            padding: 0.9rem 1.4rem;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: all 0.25s ease;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        .input-field:focus {
            border-color: #D8B4FE;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 3px rgba(216, 180, 254, 0.3);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.55);
            font-weight: 400;
            font-size: 0.9rem;
        }

        .btn-login {
            background: linear-gradient(98deg, #F54927, #E8745D, #E8745D);
            border: none;
            border-radius: 2.5rem;
            padding: 0.9rem 1rem;
            font-size: 1.05rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            margin-top: 0.25rem;
            box-shadow: 0 12px 22px -10px rgba(0, 0, 0, 0.45);
            letter-spacing: 0.5px;
            backdrop-filter: blur(2px);
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.55);
        }

        .btn-login:active { transform: scale(0.98); }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message-area {
            text-align: center;
            font-size: 0.8rem;
            color: #FFD8B5;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.55);
            border-left: 3px solid #FFAA6E;
            border-radius: 3rem;
            padding: 0.55rem 1rem;
            width: auto;
            align-self: center;
            backdrop-filter: blur(4px);
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.4px;
        }

        @media (max-width: 550px) {
            .glass-panel { padding: 1.8rem 1.5rem; margin: 1rem; border-radius: 1.8rem; }
            .app-brand h1 { font-size: 1.7rem; }
            .input-field { padding: 0.75rem 1.2rem; }
            .btn-login { padding: 0.8rem; }
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-drink-right" aria-hidden="true"></div>

    <div class="glass-panel">
        <div class="app-brand">
            <img src="{% static 'img/logo.jpg' %}" alt="Ets J.C.Tavarès">
            <h1>Ets J.C.<span style="font-weight: 300;">Tavarès</span></h1>
            <div class="divider-light"></div>
            <p>gestion de stock &amp; ventes</p>
        </div>

        <form id="loginForm" class="login-form" method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="input-group">
                <label for="id_username">Identifiant</label>
                <input type="text" id="id_username" name="username" class="input-field"
                       placeholder="nom d'utilisateur" autocomplete="username" autofocus required>
            </div>
            <div class="input-group">
                <label for="id_password">Mot de passe</label>
                <input type="password" id="id_password" name="password" class="input-field"
                       placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            {% if form.errors %}
              <div class="message-area">Identifiant ou mot de passe incorrect.</div>
            {% endif %}
            <button type="submit" class="btn-login" id="loginBtn">➤ SE CONNECTER</button>
        </form>
        <div class="login-footer">Espace sécurisé · connexion premium</div>
    </div>

    <script>
        // Feedback visuel uniquement : la soumission reste un POST HTML classique
        // gere par la LoginView de Django (CSRF, session, redirection "next").
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        form.addEventListener('submit', function () {
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loader"></span> Vérification…';
        });

        document.querySelectorAll('.input-field').forEach(function (input) {
            input.addEventListener('focus', function () {
                input.parentElement.style.transform = 'translateX(2px)';
            });
            input.addEventListener('blur', function () {
                input.parentElement.style.transform = 'translateX(0)';
            });
        });
    </script>
</body>
</html>
