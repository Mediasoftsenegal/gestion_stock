{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content-main">

    {% csrf_token %}
    <fieldset class="module aligned">
      {{ form.as_p }}
    </fieldset>
    <div class="submit-row">
      <input type="submit" value="Importer" class="default">
      <a href="../" class="button cancel-link">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
